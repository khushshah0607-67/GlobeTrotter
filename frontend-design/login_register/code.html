<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>GlobeTrotter - Login &amp; Register</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#0b1c30",
                        "on-surface-variant": "#3f4850",
                        "surface-container-high": "#dce9ff",
                        "surface-variant": "#d3e4fe",
                        "on-tertiary-fixed": "#25005a",
                        "tertiary": "#712ae2",
                        "on-error": "#ffffff",
                        "outline-variant": "#bfc7d2",
                        "surface-tint": "#006398",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#d2bbff",
                        "tertiary-container": "#8a4cfc",
                        "secondary-fixed": "#ffddb8",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#004b73",
                        "on-primary-fixed": "#001d31",
                        "outline": "#707881",
                        "error-container": "#ffdad6",
                        "on-background": "#0b1c30",
                        "primary": "#006194",
                        "primary-fixed": "#cce5ff",
                        "on-tertiary-container": "#fffbff",
                        "surface-container-low": "#eff4ff",
                        "on-primary": "#ffffff",
                        "secondary": "#855300",
                        "on-primary-container": "#fdfcff",
                        "secondary-container": "#fea619",
                        "inverse-primary": "#93ccff",
                        "inverse-surface": "#213145",
                        "secondary-fixed-dim": "#ffb95f",
                        "primary-container": "#007bb9",
                        "on-secondary-fixed": "#2a1700",
                        "surface-dim": "#cbdbf5",
                        "on-secondary": "#ffffff",
                        "background": "#f8f9ff",
                        "surface-bright": "#f8f9ff",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f8f9ff",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "inverse-on-surface": "#eaf1ff",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#93ccff",
                        "on-secondary-container": "#684000",
                        "surface-container": "#e5eeff",
                        "tertiary-fixed": "#eaddff",
                        "on-secondary-fixed-variant": "#653e00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "component-padding-y": "8px",
                        "section-gap": "48px",
                        "component-padding-x": "16px",
                        "container-margin": "24px",
                        "gutter": "16px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Smooth transitions for toggling between login and register */
        .auth-view-enter { opacity: 0; transform: translateY(10px); }
        .auth-view-enter-active { opacity: 1; transform: translateY(0); transition: opacity 300ms, transform 300ms; }
        .auth-view-exit { opacity: 1; transform: translateY(0); }
        .auth-view-exit-active { opacity: 0; transform: translateY(-10px); transition: opacity 300ms, transform 300ms; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Auth Canvas -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant overflow-hidden relative">
<!-- Loading Overlay (Hidden by default) -->
<div class="absolute inset-0 bg-surface-container-lowest/80 backdrop-blur-sm z-50 hidden flex-col items-center justify-center" id="loadingOverlay">
<span class="material-symbols-outlined animate-spin text-primary font-display-lg text-display-lg" data-icon="autorenew">autorenew</span>
<p class="mt-4 font-body-md text-body-md text-on-surface">Authenticating...</p>
</div>
<div class="p-container-margin md:p-8">
<!-- Header -->
<div class="text-center mb-section-gap">
<h1 class="font-display-lg text-display-lg text-primary mb-2">GlobeTrotter</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your Expert Concierge</p>
</div>
<!-- Login View -->
<div class="block transition-all duration-300" id="loginView">
<h2 class="font-headline-md text-headline-md mb-6 text-on-surface text-center">Welcome Back</h2>
<!-- Error Message (Hidden by default) -->
<div class="hidden mb-4 p-3 bg-error-container text-on-error-container rounded-lg font-body-sm text-body-sm flex items-center gap-2" id="loginError">
<span class="material-symbols-outlined" data-icon="error">error</span>
<span class="">Invalid credentials. Please try again.</span>
</div>
<form class="space-y-4" id="loginForm">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="loginEmail">Email</label>
<input class="w-full rounded-lg border-outline-variant bg-surface-bright text-on-surface focus:ring-2 focus:ring-primary focus:border-primary px-3 py-2 font-body-md text-body-md transition-shadow" id="loginEmail" placeholder="traveler@example.com" required="" type="email">
</div>
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="loginPassword">Password</label>
<input class="w-full rounded-lg border-outline-variant bg-surface-bright text-on-surface focus:ring-2 focus:ring-primary focus:border-primary px-3 py-2 font-body-md text-body-md pr-10 transition-shadow" id="loginPassword" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-7 text-on-surface-variant hover:text-primary transition-colors toggle-password" data-target="loginPassword" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>

</div>
<button class="w-full bg-primary text-on-primary hover:bg-primary-container hover:text-on-primary-container font-label-md text-label-md py-3 rounded-lg transition-colors flex items-center justify-center gap-2 mt-6" type="submit">
<span class="">Sign In</span>
<span class="material-symbols-outlined" data-icon="login">login</span>
</button>
</form>
</div>
<!-- Register View (Hidden by default) -->
<div class="hidden transition-all duration-300" id="registerView">
<h2 class="font-headline-md text-headline-md mb-6 text-on-surface text-center">Create Account</h2>
<form class="space-y-4" id="registerForm">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="regName">Full Name</label>
<input class="w-full rounded-lg border-outline-variant bg-surface-bright text-on-surface focus:ring-2 focus:ring-primary focus:border-primary px-3 py-2 font-body-md text-body-md transition-shadow" id="regName" placeholder="Jane Doe" required="" type="text">
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="regEmail">Email</label>
<input class="w-full rounded-lg border-outline-variant bg-surface-bright text-on-surface focus:ring-2 focus:ring-primary focus:border-primary px-3 py-2 font-body-md text-body-md transition-shadow" id="regEmail" placeholder="traveler@example.com" required="" type="email">
</div>
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="regPassword">Password</label>
<input class="w-full rounded-lg border-outline-variant bg-surface-bright text-on-surface focus:ring-2 focus:ring-primary focus:border-primary px-3 py-2 font-body-md text-body-md pr-10 transition-shadow" id="regPassword" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-7 text-on-surface-variant hover:text-primary transition-colors toggle-password" data-target="regPassword" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<button class="w-full bg-primary text-on-primary hover:bg-primary-container hover:text-on-primary-container font-label-md text-label-md py-3 rounded-lg transition-colors flex items-center justify-center gap-2 mt-6" type="submit">
<span class="">Sign Up</span>
<span class="material-symbols-outlined" data-icon="person_add">person_add</span>
</button>
</form>
</div>
<!-- Separator -->

<!-- Social Logins -->

<!-- Toggle Link -->
<div class="text-center font-body-sm text-body-sm text-on-surface-variant">
<span id="toggleText" class="">Don't have an account?</span>
<button class="text-primary font-bold hover:underline ml-1" id="toggleAuthView" type="button">Sign Up</button>
</div>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginView = document.getElementById('loginView');
            const registerView = document.getElementById('registerView');
            const toggleBtn = document.getElementById('toggleAuthView');
            const toggleText = document.getElementById('toggleText');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loginError = document.getElementById('loginError');

            let isLogin = true;

            // Toggle Auth Views
            toggleBtn.addEventListener('click', () => {
                isLogin = !isLogin;
                
                if (isLogin) {
                    registerView.classList.add('hidden');
                    loginView.classList.remove('hidden');
                    toggleText.textContent = "Don't have an account?";
                    toggleBtn.textContent = "Sign Up";
                    loginError.classList.add('hidden');
                } else {
                    loginView.classList.add('hidden');
                    registerView.classList.remove('hidden');
                    toggleText.textContent = "Already have an account?";
                    toggleBtn.textContent = "Sign In";
                }
            });

            // Password Visibility Toggle
            const togglePasswords = document.querySelectorAll('.toggle-password');
            togglePasswords.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const targetId = btn.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    const icon = btn.querySelector('span');

                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.textContent = 'visibility_off';
                    } else {
                        input.type = 'password';
                        icon.textContent = 'visibility';
                    }
                });
            });

            // Mock Form Submission
            const handleAuthSubmit = (e, isLoginForm) => {
                e.preventDefault();
                loadingOverlay.classList.remove('hidden');
                loginError.classList.add('hidden');
                
                // Simulate network request
                setTimeout(() => {
                    loadingOverlay.classList.add('hidden');
                    if (isLoginForm) {
                        // Mock error on login for demonstration
                        loginError.classList.remove('hidden');
                    }
                }, 1500);
            };

            loginForm.addEventListener('submit', (e) => handleAuthSubmit(e, true));
            registerForm.addEventListener('submit', (e) => handleAuthSubmit(e, false));
        });
    </script>


</body></html>
